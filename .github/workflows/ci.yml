# Extensão E1 — Pipeline de CI (RF-50 a RF-52 do PRD).
# Roda a cada push na main e a cada pull request para a main:
# lint, formatação, testes (sem o marcador `live`) e build do pacote.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, testes e build (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv e Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Instalar dependências (lock travado)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatação (ruff format --check)
        run: uv run ruff format --check .

      - name: Testes automatizados (exclui marcador live)
        run: uv run pytest -m "not live"

      - name: Build do pacote (sdist + wheel)
        run: uv build

      - name: Conferir artefatos do build
        run: ls -la dist/
